{% extends "base.html" %}
{% block content %}
  <h2>Documents</h2>
  {% if current_user.role == 'owner' %}<p><a href="{{ url_for('docs.upload') }}">Upload</a></p>{% endif %}
  <table>
    <tr><th>Title</th><th>Category</th><th>Owner</th></tr>
    {% for d in docs %}
      <tr><td><a href="{{ url_for('docs.detail', doc_id=d.id) }}">{{ d.title }}</a></td>
          <td>{{ d.category }}</td><td>{{ d.owner.name }}</td></tr>
    {% else %}
      <tr><td colspan="3">No documents.</td></tr>
    {% endfor %}
  </table>
{% endblock %}
